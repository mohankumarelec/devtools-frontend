<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: ws: wss: http: https:;" />
  <title>Remote Browser</title>

  <!-- DevTools design system tokens for --sys-color-*, --ref-palette-* -->
  <link rel="stylesheet" href="../front_end/design_system_tokens.css" />
  <link rel="stylesheet" href="../front_end/application_tokens.css" />

  <style>
    :root {
      --ref-palette-neutral10: #1b1b1f;
      --ref-palette-neutral30: #46464f;
      --ref-palette-neutral50: #767680;
      --ref-palette-neutral60: #90909a;
      --ref-palette-neutral90: #e2e1ec;
      --ref-palette-neutral99: #fffbff;
      --ref-palette-neutral-variant90: #e1e0f0;
      --ref-palette-primary10: #00006e;
      --ref-palette-primary40: #5256a9;
      --color-background-opacity-80: rgba(255, 255, 255, 0.8);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --ref-palette-neutral10: #e5e1e6;
        --ref-palette-neutral30: #c8c5d0;
        --ref-palette-neutral50: #939094;
        --ref-palette-neutral60: #7a7880;
        --ref-palette-neutral90: #313036;
        --ref-palette-neutral99: #1b1b1f;
        --ref-palette-neutral-variant90: #313040;
        --ref-palette-primary10: #c4c0ff;
        --ref-palette-primary40: #b9b5ff;
        --color-background-opacity-80: rgba(0, 0, 0, 0.8);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--sys-color-surface, #fff);
      color: var(--sys-color-on-surface, #1b1b1f);
    }

    body { display: flex; flex-direction: column; }
    body.undocked { display: flex; flex-direction: column; }

    /* Connection UI styles */
    #connection-ui {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 20px;
    }

    .connection-card {
      max-width: 520px;
      width: 100%;
      padding: 40px;
      border-radius: 16px;
      background: var(--sys-color-surface-variant, #f5f5f5);
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    .connection-card h1 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .connection-card p {
      font-size: 14px;
      color: var(--sys-color-on-surface-subtle, #666);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .connection-card code {
      background: rgba(0,0,0,0.06);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
    }

    .input-group {
      margin-bottom: 16px;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--sys-color-on-surface-subtle, #666);
    }

    .input-group input {
      width: 100%;
      padding: 10px 14px;
      font-size: 15px;
      border: 1px solid var(--sys-color-divider, #ddd);
      border-radius: 8px;
      background: var(--sys-color-surface, #fff);
      color: var(--sys-color-on-surface, #1b1b1f);
      outline: none;
      transition: border-color 0.15s;
    }

    .input-group input:focus {
      border-color: var(--sys-color-primary, #5256a9);
      box-shadow: 0 0 0 2px rgba(82, 86, 169, 0.15);
    }

    .primary-btn {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-weight: 500;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: var(--sys-color-primary, #5256a9);
      color: white;
      transition: opacity 0.15s;
    }

    .primary-btn:hover { opacity: 0.9; }
    .primary-btn:active { opacity: 0.8; }

    .targets-list {
      margin-top: 20px;
    }

    .targets-list h3 {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .target-item {
      display: flex;
      flex-direction: column;
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 6px;
      border: 1px solid var(--sys-color-divider, #ddd);
      border-radius: 8px;
      background: var(--sys-color-surface, #fff);
      cursor: pointer;
      text-align: left;
      transition: background 0.1s;
    }

    .target-item:hover {
      background: var(--sys-color-surface-variant, #f0f0f0);
    }

    .target-title {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 2px;
    }

    .target-url {
      font-size: 12px;
      color: var(--sys-color-on-surface-subtle, #888);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .error-msg {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      background: #fce4ec;
      color: #c62828;
      font-size: 13px;
      line-height: 1.4;
    }

    .help-text {
      margin-top: 20px;
      font-size: 13px;
      color: var(--sys-color-on-surface-subtle, #888);
    }

    .help-text summary {
      cursor: pointer;
      margin-bottom: 8px;
    }

    .help-text pre {
      background: rgba(0,0,0,0.06);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      overflow-x: auto;
      margin-bottom: 8px;
    }

    .help-text p { margin-bottom: 4px; }
  </style>
</head>
<body class="undocked" id="-blink-dev-tools">
  <div id="connection-ui"></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
